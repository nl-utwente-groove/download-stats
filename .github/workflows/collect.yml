name: Collect download counts
run-name: Collecting the download counts of ${{ github.event_name == 'schedule' && 'today' || 'today (manual run)' }}

on:
  schedule:
    # daily; an odd minute, since GitHub delays and drops jobs scheduled on
    # the hour
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

# a manual run overlapping the scheduled one must not race it to the push
concurrency: collect

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
    - name: Check out
      uses: actions/checkout@v7
    - name: Take today's snapshot
      # the releases of nl-utwente-groove/code are public; the token only
      # lifts the anonymous rate limit
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash collect.sh
    - name: Rewrite the totals table
      run: bash totals.sh
    - name: Commit and push
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add snapshots.csv README.md
        git diff --cached --quiet || git commit -m "Snapshot of $(date -u +%F)"
        git push
